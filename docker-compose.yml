version: "3.8"

services:
  db:
    build: ./db
    container_name: db
    environment:
      - POSTGRES_DB=clinica
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  app:
    build: ./backend
    container_name: clinic-app
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=clinica
      - DB_USER=admin
      - DB_PASS=admin
      - DB_PORT=5432
    ports:
      - "5006:5006"

volumes:
  db_data:
