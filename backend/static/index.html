<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Pacientes</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistema de Gestión de Pacientes</h1>
        </header>

        <div id="loginSection" class="auth-section">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email:</label>
                    <input type="email" id="loginEmail" name="email" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Contraseña:</label>
                    <input type="password" id="loginPassword" name="password" required>
                </div>
                <button type="submit" class="btn">Iniciar Sesión</button>
                <p>¿No tienes cuenta? <a href="#" id="showRegister">Regístrate</a></p>
            </form>
        </div>

        <div id="registerSection" class="auth-section" style="display: none;">
            <h2>Registro de Médico</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="registerNombre">Nombre:</label>
                    <input type="text" id="registerNombre" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email:</label>
                    <input type="email" id="registerEmail" name="email" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Contraseña:</label>
                    <input type="password" id="registerPassword" name="password" required>
                </div>
                <div class="form-group">
                    <label for="registerEspecialidad">Especialidad:</label>
                    <input type="text" id="registerEspecialidad" name="especialidad" required>
                </div>
                <button type="submit" class="btn">Registrarse</button>
                <p>¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia Sesión</a></p>
            </form>
        </div>

        <div id="mainContent" style="display: none;">
            <section class="form-section">
                <h2>Registrar Nuevo Paciente</h2>
                <form id="formularioPaciente">
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="edad">Edad:</label>
                        <input type="number" id="edad" name="edad" required min="0" max="150">
                    </div>
                    <div class="form-group">
                        <label for="historialMedico">Historial Médico:</label>
                        <textarea id="historialMedico" name="historialMedico" required></textarea>
                    </div>
                    <button type="submit" class="btn">Registrar Paciente</button>
                </form>
            </section>

            <section class="patients-section">
                <h2>Lista de Pacientes</h2>
                <div class="lista-pacientes" id="listaPacientes">
                    <!-- Los pacientes se cargarán aquí dinámicamente -->
                </div>
            </section>
            
            <button id="logoutBtn" class="btn btn-danger">Cerrar Sesión</button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
